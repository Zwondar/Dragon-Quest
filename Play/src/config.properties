# 2026-11-09 新增（优先级4）：网络与数据库配置。
# 可以用 JVM 参数覆盖，例如：-Dserver.host=192.168.1.10
# 请勿把真实的数据库密码提交到公开仓库。

# 客户端要连接的聊天服务器地址与端口
server.host=127.0.0.1
server.port=15588

# 客户端接收服务器消息的端口（同一台机器只能运行一个客户端实例）
client.port=15589

# 服务器端 MySQL 配置（驱动 jar 需要放在 classpath 中，例如 lib/mysql-connector-j-8.2.0.jar）
db.url=jdbc:mysql://127.0.0.1:3306/text?useUnicode=true&characterEncoding=utf8
db.user=root
db.password=123456
